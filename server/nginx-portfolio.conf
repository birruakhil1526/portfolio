# installed as /etc/nginx/sites-available/portfolio by server/home-relay-install.sh
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;
	include /etc/nginx/snippets/portfolio-common.conf;
}

# written by server/https-setup.sh once there is a certificate: the https server for the domain
include /etc/nginx/snippets/portfolio-https-*.conf;
