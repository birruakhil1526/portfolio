# speech-to-text relay: a few requests a minute per visitor, so the NVIDIA key's credits can't be drained
limit_req_zone $binary_remote_addr zone=stt:1m rate=6r/m;

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;
	root /var/www/html;
	index index.html;
	server_tokens off;

	gzip on;
	gzip_static on;
	gzip_vary on;
	gzip_comp_level 6;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;

	add_header Cache-Control "public, max-age=600";
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

	location / {
		try_files $uri $uri/ =404;
	}

	# show the resume in the browser's pdf viewer instead of downloading it
	location = /Akhil_Birru_Resume.pdf {
		add_header Content-Disposition 'inline; filename="Akhil_Birru_Resume.pdf"' always;
		add_header Cache-Control "public, max-age=600";
		add_header X-Content-Type-Options "nosniff" always;
	}

	# speech-to-text page: same login as /stats/; may call /api/stt and use the microphone
	location /stt/ {
		auth_basic "stt";
		auth_basic_user_file /etc/nginx/.htpasswd-stats;
		try_files $uri $uri/ =404;
		add_header Cache-Control "no-store" always;
		add_header X-Robots-Tag "noindex" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
		add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
	}

	# relays audio to NVIDIA's hosted Parakeet model; fcgiwrap starts server/stt/transcribe.py per request
	location = /api/stt {
		auth_basic "stt";
		auth_basic_user_file /etc/nginx/.htpasswd-stats;
		limit_except POST { deny all; }
		limit_req zone=stt burst=3 nodelay;
		limit_req_status 429;
		client_max_body_size 4m;
		fastcgi_pass unix:/run/fcgiwrap.socket;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME /opt/stt/transcribe.py;
		fastcgi_read_timeout 120s;
		add_header X-Content-Type-Options "nosniff" always;
	}

	# visitor stats, generated from access logs by goaccess
	location /stats/ {
		alias /var/www/stats/;
		auth_basic "stats";
		auth_basic_user_file /etc/nginx/.htpasswd-stats;
		add_header Cache-Control "no-store" always;
		add_header X-Robots-Tag "noindex" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data:; frame-ancestors 'none'" always;
	}
}
