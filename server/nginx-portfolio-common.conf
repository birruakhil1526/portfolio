# shared by the http (IP) and https (DuckDNS domain) servers; installed as /etc/nginx/snippets/portfolio-common.conf
root /var/www/html;
index index.html;
server_tokens off;

gzip on;
gzip_static on;
gzip_vary on;
gzip_comp_level 6;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

add_header Cache-Control "public, max-age=600";
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

# Let's Encrypt http-01 challenges (server/https-setup.sh); outside the web root so site-pull never deletes them
location ^~ /.well-known/acme-challenge/ {
	root /var/www/acme;
	default_type text/plain;
}

location / {
	try_files $uri $uri/ =404;
}

# show the resume in the browser's pdf viewer instead of downloading it
location = /Akhil_Birru_Resume.pdf {
	add_header Content-Disposition 'inline; filename="Akhil_Birru_Resume.pdf"' always;
	add_header Cache-Control "public, max-age=600";
	add_header X-Content-Type-Options "nosniff" always;
}

# home control page: same headers as above plus connect-src 'self' so it can call /home/api/
location /home/ {
	add_header Cache-Control "no-cache" always;
	add_header X-Robots-Tag "noindex" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
	try_files $uri $uri/ =404;
}

# home control relay (home/relay.py, systemd unit home-relay); the bridge long-polls for 25 s
location /home/api/ {
	proxy_pass http://127.0.0.1:8787;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header Host $host;
	proxy_read_timeout 60s;
	proxy_buffering off;
	client_max_body_size 256k;
	add_header Cache-Control "no-store" always;
	add_header X-Content-Type-Options "nosniff" always;
}

# visitor stats, generated from access logs by goaccess
location /stats/ {
	alias /var/www/stats/;
	auth_basic "stats";
	auth_basic_user_file /etc/nginx/.htpasswd-stats;
	add_header Cache-Control "no-store" always;
	add_header X-Robots-Tag "noindex" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data:; frame-ancestors 'none'" always;
}
