# Ledger: installed as /etc/nginx/snippets/ledger.conf and included in the portfolio server block.
# Pages are static files from site/ledger/; /ledger/api/ goes to the service on 127.0.0.1:8790.

location /ledger/ {
	try_files $uri $uri/ =404;
	add_header Cache-Control "public, max-age=300";
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}

# public API: stats, the live stream (Server-Sent Events), recent catches, the lab, visitor watches
location /ledger/api/ {
	limit_req zone=ledger burst=30 nodelay;
	limit_req_status 429;
	client_max_body_size 4k;
	proxy_pass http://127.0.0.1:8790/api/;
	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Remote-User "";
	proxy_buffering off;
	proxy_cache off;
	proxy_read_timeout 1h;
	add_header X-Content-Type-Options "nosniff" always;
}

# console: same login as /stats/
location /ledger/console/ {
	auth_basic "ledger";
	auth_basic_user_file /etc/nginx/.htpasswd-stats;
	try_files $uri $uri/ =404;
	add_header Cache-Control "no-store" always;
	add_header X-Robots-Tag "noindex" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "same-origin" always;
	add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}

location /ledger/console/api/ {
	auth_basic "ledger";
	auth_basic_user_file /etc/nginx/.htpasswd-stats;
	client_max_body_size 64k;
	proxy_pass http://127.0.0.1:8790/api/admin/;
	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Remote-User $remote_user;
	proxy_read_timeout 60s;
	add_header Cache-Control "no-store" always;
	add_header X-Content-Type-Options "nosniff" always;
}
